name: Application CI

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend lint, format and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # No service credentials or real database are available to unit tests.
      DATABASE_URL: postgres://test:test@127.0.0.1:1/tashkent_ci
      TELEGRAM_BOT_TOKEN: ''
      ALLOW_E2E_SEED: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test CI component selection
        working-directory: .
        run: node --test scripts/ci-component.test.mjs
      - name: Select component work
        id: changes
        working-directory: .
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-component.mjs backend
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run != 'false'
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.run != 'false'
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@v4
        if: steps.changes.outputs.run != 'false'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-backend-${{ hashFiles('backend/bun.lock') }}
      - if: steps.changes.outputs.run != 'false'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.run != 'false'
        run: bun run lint
      - if: steps.changes.outputs.run != 'false'
        run: bun run format:check
      - if: steps.changes.outputs.run != 'false'
        run: bun run test:coverage

  frontend:
    name: Frontend lint, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Test CI component selection
        working-directory: .
        run: node --test scripts/ci-component.test.mjs
      - name: Select component work
        id: changes
        working-directory: .
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ci-component.mjs frontend
      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run != 'false'
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@v2
        if: steps.changes.outputs.run != 'false'
        with:
          bun-version: '1.4.4'
      - uses: actions/cache@v4
        if: steps.changes.outputs.run != 'false'
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-1.4.4-frontend-${{ hashFiles('frontend/bun.lock') }}
      - if: steps.changes.outputs.run != 'false'
        run: bun install --frozen-lockfile
      - if: steps.changes.outputs.run != 'false'
        run: bun run lint
      # Node-only preview-filter tests run in vercel-preview-filter.yml.
      - if: steps.changes.outputs.run != 'false'
        run: bun run test:coverage
      - if: steps.changes.outputs.run != 'false'
        run: bun run build
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:1/api

