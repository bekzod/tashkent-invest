services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: tashkent_invest
      POSTGRES_USER: tashkent_invest
      POSTGRES_PASSWORD: tashkent_invest
    ports:
      - "5432:5432"
    volumes:
      - tashkent-invest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tashkent_invest -d tashkent_invest"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://tashkent_invest:tashkent_invest@postgres:5432/tashkent_invest
      JWT_SECRET: local-development-secret-change-me
      FRONT_HOST_NAME: http://localhost:3000
      TZ: Asia/Tashkent
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080/api
      NEXT_PUBLIC_MAP_TILE_URL: https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png
      TZ: Asia/Tashkent
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://127.0.0.1:3000/uz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  tashkent-invest-postgres:
